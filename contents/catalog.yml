  # Si le champ est absent ou vaut false, aucun bandeau n'est affiché.
  - id: custom-cookie-box
    name: Ma boîte personnalisée
    description: La recette de notre cookie chocolat, sans le chocolat habituel et avec les toppings de votre choix. Composez une boîte de 12 cookies identiques avec 1 à 3 toppings.
    ingredients:
      - label: Farine bio
        is_allergen: true
      - label: Beurre doux
        is_allergen: false
      - label: Cassonnade
        is_allergen: false
      - label: Sucre blanc
        is_allergen: false
      - label: Œuf plein air
        is_allergen: true
      - label: Levure chimique
        is_allergen: false
    price: 1.50
