      - { id: pistaches, label: Pistaches, is_allergen: true }
      - { id: cranberries, label: Cranberries, is_allergen: false }
      - { id: cafe, label: Café, is_allergen: false }
      - { id: coco, label: Coco, is_allergen: true }
      - { id: amandes, label: Amandes, is_allergen: true }
