name: Mettre à jour la cagnotte

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-cagnotte
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Vérifier le secret
        env:
          COOKIDS_STATS_TOKEN: ${{ secrets.COOKIDS_STATS_TOKEN }}
        run: |
          if [ -z "$COOKIDS_STATS_TOKEN" ]; then
            echo "Configurer le secret COOKIDS_STATS_TOKEN."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.COOKIDS_STATS_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recalculer le total
        env:
          COOKIDS_STATS_TOKEN: ${{ secrets.COOKIDS_STATS_TOKEN }}
        run: pnpm exec tsx scripts/update-statistics.ts
      - name: Publier le compteur
        run: |
          if git diff --quiet -- contents/statistics.yml; then
            echo "Le compteur est déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contents/statistics.yml
          git commit -m "chore: update sold cookies counter"
          git push origin HEAD:main
